name: servick
description: "سيرفيسك — اطلب ميكانيكي أو كهربائي في خميس مشيط وأبها وأحد رفيدة."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  crypto: ^3.0.7
  file_picker: ^10.3.3
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  image: ^4.5.4
  shared_preferences: ^2.5.6
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/servick_mark.png
    - assets/brand/servick_symbol.png
    - assets/brand/rabitt_mark.png
    - assets/brand/rabitt_wordmark.png
    - assets/brand/hood_open.jpg
    - assets/services/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
